apiVersion: batch/v1
kind: CronJob
metadata:
  name: price-checker
spec:
  schedule: "0 9 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: checker
              image: plane-ticket-checker:v4
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: tracker-secret
                      key: DATABASE_URL
                - name: SERPAPI_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tracker-secret
                      key: SERPAPI_KEY
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: tracker-secret
                      key: DISCORD_WEBHOOK_URL
