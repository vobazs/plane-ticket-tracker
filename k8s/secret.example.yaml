apiVersion: v1
kind: Secret
metadata:
  name: tracker-secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres:5432/tracker"
  POSTGRES_PASSWORD: "CHANGE_ME"
  SERPAPI_KEY: "YOUR_SERPAPI_KEY"
  DISCORD_WEBHOOK_URL: "YOUR_DISCORD_WEBHOOK_URL"
  DISCORD_TOKEN: "YOUR_DISCORD_BOT_TOKEN"
